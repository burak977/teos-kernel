name: Build Venus V5 (TEOS) Linux 4.19 Android 14 Kernel
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout TEOS Files
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev device-tree-compiler python3 python3-pip cpio binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone Clang Toolchain & Mi8917 Linux 4.19 Kernel
        run: |
          export GIT_TERMINAL_PROMPT=0
          
          echo "Cloning Clang toolchain..."
          git clone --depth=1 https://github.com clang || true
          
          echo "Cloning LineageOS Kernel..."
          # Klasor ismini acikca 'kernel' olarak belirterek klonluyoruz
          git clone --depth=1 https://github.com kernel

      - name: Inject Vestel Venus V5 (TEOS) Board ID, Panel & Focaltech FT8607 Touch
        run: |
          if [ ! -d "kernel" ]; then
            echo "HATA: kernel klasoru bulunamadi! Klonlama adimi basarisiz olmus."
            exit 1
          fi
          cd kernel
          for dts in $(find arch/arm64/boot/dts -name "*rolex*.dts" -o -name "*msm8917*.dts"); do
            sed -i 's/qcom,msm-id = .*/qcom,msm-id = <0x140 0x00>, <0x139 0x00>;/' "$dts"
            sed -i 's/qcom,board-id = .*/qcom,board-id = <0x580008 0xd0>, <0x10008 0x03>;/' "$dts"
          done
          DEFCONFIG=$(find arch/arm64/configs -type f -name "*defconfig" | head -n 1)
          echo "CONFIG_TOUCHSCREEN_FTS=y" >> "$DEFCONFIG"
          echo "CONFIG_DRM_MSM=y" >> "$DEFCONFIG"
          echo "CONFIG_ANDROID_BINDERFS=y" >> "$DEFCONFIG"
          echo "CONFIG_DEVTMPFS=y" >> "$DEFCONFIG"

      - name: Compile Linux 4.19 Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          DEFCONFIG_PATH=$(find arch/arm64/configs -type f -name "*defconfig" | head -n 1)
          DEFCONFIG_NAME=$(basename "$DEFCONFIG_PATH")
          make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          
          sed -i 's/-Werror//g' Makefile || true
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} + || true
          
          # HOSTCC=clang eklenerek scripts/ araclarinin yerel GCC yerine Clang ile derlenmesi saglandi
          make -j4 O=out ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" HOSTCFLAGS="-w -fcommon -Wno-error" HOSTLDFLAGS="-fcommon" Image.gz-dtb || make -j4 O=out ARCH=arm64 CC=clang HOSTCC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w" HOSTCFLAGS="-w -fcommon -Wno-error" HOSTLDFLAGS="-fcommon" Image.gz

      - name: Repack into Flashable boot_teos_a14_4.19.img
        run: |
          python3 -c '
          import struct, glob, os
          with open("base_boot.img", "rb") as f: orig = f.read()
          k_size, k_addr, r_size, r_addr, s_size, s_addr, tags_addr, page_size = struct.unpack("<8I", orig[8:40])
          
          k_files = glob.glob("kernel/out/arch/arm64/boot/Image.gz-dtb") + glob.glob("kernel/out/arch/arm64/boot/Image.gz")
          with open(k_files[0], "rb") as f: new_k = f.read()
          
          if not k_files[0].endswith("-dtb"):
              os.system("dtc -I dts -O dtb -o teos_419.dtb teos_stock.dts 2>/dev/null || true")
              if os.path.exists("teos_419.dtb"):
                  with open("teos_419.dtb", "rb") as df: new_k += df.read()
                  
          new_k_size = len(new_k)
          old_k_pages = (k_size + page_size - 1) // page_size
          ramdisk_offset = (1 + old_k_pages) * page_size
          rest_of_img = orig[ramdisk_offset:]
          
          new_hdr = bytearray(orig[:page_size])
          struct.pack_into("<I", new_hdr, 8, new_k_size)
          k_pad = (page_size - (new_k_size % page_size)) % page_size
          
          with open("boot_teos_a14_4.19.img", "wb") as out:
              out.write(new_hdr)
              out.write(new_k)
              out.write(b"\x00" * k_pad)
              out.write(rest_of_img)
          print("Yeni Android 14 boot imaji hazir! Boyut:", os.path.getsize("boot_teos_a14_4.19.img"))
          '

      - name: Upload Flashable Boot Image & Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Venus-V5-TEOS-Android14-Boot-Image
          path: |
            boot_teos_a14_4.19.img
            base_boot.img
            kernel/out/arch/arm64/boot/Image*
